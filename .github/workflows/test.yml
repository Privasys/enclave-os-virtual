#
# Unit tests and vet.
#
# This repository had 142 tests and no workflow that ran any of them: the four
# build-* workflows produce images and never invoke `go test`. The 2026-09-17
# disclosure included defects the existing suite would have caught had it run,
# so this is deliberately cheap and always-on rather than thorough.
#
# Runs on every PR and every push to main. Seconds, not minutes — there is no
# reason to gate it behind a label or a schedule.

name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # go.mod carries `replace` directives onto sibling repositories laid out
      # as ../../platform/*, so nothing in this module compiles from a
      # single-repo checkout. build-tdx.yml does the same thing; without it
      # every build here fails with "replacement directory ... does not exist".
      - name: Clone SDK siblings (go.mod replace directives)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone Privasys/ra-tls-clients "$GITHUB_WORKSPACE/../../platform/ra-tls-clients" -- --depth 1
          gh repo clone Privasys/enclave-vaults-client "$GITHUB_WORKSPACE/../../platform/enclave-vaults-client" -- --depth 1

      # The manager targets Linux and several packages use Linux-only syscalls
      # (O_DIRECT, Statfs) plus purego dlopen, so this only builds on Linux.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race: data races fail the run. -tags testhooks: compiles the
      # test-only entry points (internal/launcher/testhooks.go) that let the
      # manager's tests boot in main's order and run the pre-start checks
      # under the launcher's real load lock. Never set on an image build.
      - name: Test
        run: go test ./... -count=1 -race -tags testhooks

      # Mount and filesystem-encryption behaviour only shows as root: the
      # read-only bind reaching a container's (slave) mount view, holder
      # folders on a real ext4 loop device. Run as a normal user these tests
      # SKIP, which is how a read-only bind that never reached the container
      # shipped to a dev host (145-dev). Here they must run: any skip fails.
      - name: Root-only tests
        run: |
          go test -c -o "$RUNNER_TEMP/holders.test" ./internal/holders/
          sudo "$RUNNER_TEMP/holders.test" -test.v -test.count=1 2>&1 | tee "$RUNNER_TEMP/root-tests.log"
          # The propagation test needs only root and mount namespaces: it
          # must always run. The loop-device test also needs a kernel with
          # filesystem encryption; it must run whenever the runner's kernel
          # has it (Ubuntu's does).
          must="TestReadOnlyBindReachesASlaveReadOnly"
          if grep -qs '^CONFIG_FS_ENCRYPTION=y' "/boot/config-$(uname -r)"; then
            must="$must|TestHolderFoldersOnALoopDevice"
          else
            echo "::warning::this runner kernel has no filesystem encryption; the loop-device test may skip"
          fi
          if grep -E -- "--- SKIP: ($must) " "$RUNNER_TEMP/root-tests.log"; then
            echo "::error::a root-only test skipped on the CI runner; it must run here"
            exit 1
          fi
          grep -qE -- "--- PASS: TestReadOnlyBindReachesASlaveReadOnly " "$RUNNER_TEMP/root-tests.log"
