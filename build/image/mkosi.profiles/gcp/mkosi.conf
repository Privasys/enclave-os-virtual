[Content]
# GCE support without the guest environment. The image ships no
# google-guest-agent, no OS Login and no google-compute-engine: the agent
# creates accounts from metadata and runs metadata scripts, and the image
# never lets metadata act. What it does need from GCE is vendored in
# mkosi.extra.gcp/ (Apache-2.0, google-compute-engine 20260819.00, the
# version these images shipped until then):
#   65-gce-disk-naming.rules + google_nvme_id: the /dev/disk/by-id/google-*
#     names luks-setup, container-volumes-setup and the GPU disk-mounter use
#   60-gce-network-security.conf, gce-blacklist.conf (nouveau),
#   gce-resolved.conf: the settings the package applied
# google_nvme_id needs nvme-cli.
Packages=
    nvme-cli

ExtraTrees=../../mkosi.extra.gcp/
