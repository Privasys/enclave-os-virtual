# systemd-logind asks for StateDirectory=systemd/linger, which systemd must
# create under /var/lib; on the dm-verity read-only root it cannot, so logind
# exited at start (status=238/STATE_DIRECTORY) and nothing handled the ACPI
# power button: a host's graceful stop waited out its timeout and ended in a
# power cut. The directory only records user lingering, which these images
# never use. With logind running, the power button powers the guest off cleanly
# (HandlePowerKey defaults to poweroff).
[Service]
StateDirectory=
