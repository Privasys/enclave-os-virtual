# Keeps the guest kernel clock correct, from inside the enclave.
#
# Nothing else does: the guest's clock runs on the TSC, so it inherits the
# machine's oscillator error. At 14 ppm it passes the 10 s tolerance of the
# trusted clock (internal/trustedtime) after about eight days, and the enclave
# is quarantined until it restarts. That check stays independent of this file:
# it compares this clock with its own NTS fetch and the monitor's signed floor.
#
# Authenticated sources only. Every packet crosses the host, which could answer
# plain NTP as any server, so there are no pools and no DHCP-supplied servers
# (the network unit asks for them, and nothing here reads them). These are four
# operators from the list compiled into the manager
# (internal/trustedtime/servers.go).
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server nts.time.nl iburst nts
server time.cloudflare.com iburst nts
authselectmode require
minsources 2

# Correct a start-up error at once, then only ever slew, at a capped rate. With
# NTS the host can only delay packets, and this bounds what delay can do.
makestep 1 3
maxslewrate 500
maxupdateskew 100.0

# The root is read-only and /run is memory, so the learned frequency and the NTS
# cookies survive a service restart but not a reboot. A boot relearns them.
driftfile /run/chrony/chrony.drift
ntsdumpdir /run/chrony

# A client only: no NTP service and no remote control. No rtcsync: the RTC is
# the host's.
port 0
cmdport 0
